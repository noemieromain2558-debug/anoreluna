<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anoreluna">
<meta name="theme-color" content="#414141">
<meta name="description" content="Espace du système — Anoreluna">
<title>Anoreluna</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #414141;
  --bg2: #383838;
  --bg3: #2e2e2e;
  --bg4: #4a4a4a;
  --surface: #4f4f4f;
  --surface2: #5a5a5a;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ece6;
  --text2: #c8c2bb;
  --text3: #9a948e;
  --accent: #c9a87c;
  --accent2: #e8c99a;
  --accent3: #a07850;
  --red: #e07070;
  --green: #7ec99a;
  --blue: #7ab0d4;
  --purple: #b09ece;
  --pink: #d4a0b8;
  --sidebar-w: 220px;
  --header-h: 56px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --font: 'Quicksand', sans-serif;
  --mono: 'Space Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg3);}
body{font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;}
button{cursor:pointer;font-family:var(--font);border:none;outline:none;}
input,textarea,select{font-family:var(--font);outline:none;border:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}

/* ── LAYOUT ─────────────────────────────────────── */
#app{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* ── SIDEBAR ─────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--bg3);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  transition:transform .3s ease;
  z-index:200;
  overflow:hidden;
}
#sidebar-logo{
  padding:16px 16px 12px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#sidebar-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);}
#sidebar-logo .app-name{font-size:17px;font-weight:700;color:var(--accent2);letter-spacing:.5px;}
#sidebar-logo .app-sub{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
#sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-section{padding:6px 12px 2px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;
  cursor:pointer;
  border-radius:0;
  transition:background .15s,color .15s;
  font-size:13px;font-weight:500;color:var(--text2);
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.nav-item.active{background:rgba(201,168,124,0.15);color:var(--accent2);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--accent);color:var(--bg3);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
#sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.sidebar-fronter{font-size:11px;color:var(--text3);}
.sidebar-fronter strong{color:var(--accent2);display:block;font-size:13px;margin-top:2px;}

/* ── MAIN CONTENT ─────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
#topbar{
  height:var(--header-h);
  background:var(--bg2);
  display:flex;align-items:center;
  padding:0 20px;gap:12px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#menu-toggle{display:none;background:transparent;color:var(--text);font-size:20px;padding:6px;}
#page-title{font-size:16px;font-weight:700;color:var(--accent2);}
#page-subtitle{font-size:11px;color:var(--text3);margin-left:auto;}
#content{flex:1;overflow-y:auto;overflow-x:hidden;}

/* ── OVERLAY (mobile) ──────────────────────────────── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}

/* ── CARDS / PANELS ──────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.card-title{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:600;margin-bottom:12px;}
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.section-grid.three{grid-template-columns:1fr 1fr 1fr;}
.full-width{grid-column:1/-1;}

/* ── HOME PAGE ──────────────────────────────────── */
#page-home{display:flex;flex-direction:column;gap:0;height:100%;}
.home-top{
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
  padding:20px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:12px;
}
.home-greeting{font-size:22px;font-weight:700;color:var(--accent2);}
.home-date{font-size:12px;color:var(--text3);}
.home-clock{font-family:var(--mono);font-size:28px;color:var(--accent);font-weight:700;letter-spacing:2px;}
.home-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:16px;}
.fronter-card{
  background:linear-gradient(135deg,rgba(201,168,124,0.15),rgba(201,168,124,0.05));
  border:1px solid rgba(201,168,124,0.3);
  border-radius:var(--radius);padding:16px;
  display:flex;align-items:center;gap:14px;
}
.fronter-avatar{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  border:2px solid var(--accent);
}
.fronter-info .label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.fronter-info .name{font-size:18px;font-weight:700;color:var(--accent2);}
.fronter-info .role{font-size:12px;color:var(--text2);}
.switch-btn{
  margin-left:auto;background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:8px 14px;
  font-size:12px;font-weight:700;
  transition:background .2s;
}
.switch-btn:hover{background:var(--accent2);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;text-align:center;
}
.stat-num{font-size:24px;font-weight:700;color:var(--accent2);font-family:var(--mono);}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.mood-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.mood-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px;border-radius:var(--radius-sm);
  background:transparent;border:1px solid var(--border);
  color:var(--text2);font-size:10px;transition:.2s;cursor:pointer;
}
.mood-btn:hover{background:rgba(255,255,255,0.07);border-color:var(--border2);}
.mood-btn.active{background:rgba(201,168,124,0.2);border-color:var(--accent);color:var(--accent2);}
.mood-btn .mood-emoji{font-size:20px;}
.recent-chat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.chat-preview{font-size:12px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

/* ── ALTERS (Présences) ──────────────────────────── */
#page-alters,#page-subsystems{padding:16px;}
.alters-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.alters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.alter-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.alter-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.alter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.alter-emoji{font-size:28px;margin-bottom:8px;}
.alter-name{font-size:15px;font-weight:700;color:var(--text);}
.alter-role{font-size:11px;color:var(--text3);margin-top:2px;}
.alter-badge{
  display:inline-block;font-size:9px;padding:2px 6px;
  border-radius:10px;margin-top:6px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;
}
.badge-active{background:rgba(126,201,154,0.2);color:var(--green);}
.badge-dormant{background:rgba(154,148,142,0.2);color:var(--text3);}
.badge-emerging{background:rgba(201,168,124,0.2);color:var(--accent);}
.fronter-indicator{
  position:absolute;top:8px;right:8px;
  font-size:9px;background:var(--accent);color:var(--bg3);
  padding:2px 6px;border-radius:10px;font-weight:700;
}

/* ── ALTER DETAIL MODAL ──────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:500;display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:16px;width:100%;max-width:440px;max-height:90vh;
  overflow-y:auto;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{
  padding:20px 20px 0;
  display:flex;align-items:flex-start;gap:14px;
  position:relative;
}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.1);border-radius:50%;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);cursor:pointer;
}
.modal-emoji{font-size:48px;}
.modal-info .modal-name{font-size:20px;font-weight:700;color:var(--accent2);}
.modal-info .modal-role{font-size:13px;color:var(--text2);margin-top:2px;}
.modal-body{padding:16px 20px 20px;}
.modal-field{margin-bottom:12px;}
.modal-label{font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.modal-value{font-size:13px;color:var(--text);}
.modal-note{
  background:var(--surface);border-radius:var(--radius-sm);
  padding:10px;font-size:13px;color:var(--text2);
  border-left:3px solid var(--accent);
}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.btn-primary{
  background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:8px 16px;
  font-size:13px;font-weight:700;transition:.2s;
}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{
  background:rgba(255,255,255,0.08);color:var(--text2);
  border-radius:var(--radius-sm);padding:8px 16px;
  font-size:13px;font-weight:600;transition:.2s;
}
.btn-ghost:hover{background:rgba(255,255,255,0.12);}
.btn-danger{background:rgba(224,112,112,0.15);color:var(--red);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600;}

/* ── CANAL (Chat) ──────────────────────────────── */
#page-chat{display:flex;flex-direction:column;height:100%;}
.chat-channels{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  padding:0 16px;background:var(--bg2);flex-shrink:0;
}
.chat-channel-tab{
  padding:12px 16px;font-size:12px;font-weight:600;
  color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;
  transition:.2s;
}
.chat-channel-tab.active{color:var(--accent2);border-bottom-color:var(--accent);}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{display:flex;gap:10px;align-items:flex-start;}
.chat-msg-avatar{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:var(--surface);border:1px solid var(--border);
}
.chat-msg-body .sender{font-size:12px;font-weight:700;color:var(--accent2);}
.chat-msg-body .sender span{font-size:10px;color:var(--text3);font-weight:400;margin-left:6px;}
.chat-msg-body .msg-text{
  background:var(--surface);border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm);
  padding:8px 12px;font-size:13px;color:var(--text);
  border:1px solid var(--border);margin-top:3px;
  max-width:360px;word-break:break-word;
}
.chat-reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.reaction-chip{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:10px;padding:2px 8px;font-size:11px;cursor:pointer;
  transition:.15s;
}
.reaction-chip:hover{background:rgba(201,168,124,0.15);}
.chat-input-area{
  background:var(--bg2);border-top:1px solid var(--border);
  padding:12px 16px;flex-shrink:0;
}
.chat-input-row{display:flex;align-items:center;gap:8px;}
.who-speaks{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 10px;
  font-size:12px;color:var(--text2);cursor:pointer;
  white-space:nowrap;
}
.chat-input{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 12px;
  font-size:13px;color:var(--text);resize:none;
  min-height:36px;max-height:100px;
}
.chat-input::placeholder{color:var(--text3);}
.chat-send{
  background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:8px 14px;
  font-size:18px;transition:.2s;flex-shrink:0;
}
.chat-send:hover{background:var(--accent2);}
.emoji-react-bar{display:flex;gap:6px;padding:6px 0;flex-wrap:wrap;}
.react-opt{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;transition:.15s;}
.react-opt:hover{background:rgba(255,255,255,0.1);}

/* ── JOURNAL ──────────────────────────────────── */
#page-journal{padding:16px;display:flex;flex-direction:column;gap:16px;height:100%;overflow-y:auto;}
.journal-new-btn{
  background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:10px 18px;
  font-size:13px;font-weight:700;align-self:flex-start;
}
.journal-entries{display:flex;flex-direction:column;gap:10px;}
.journal-entry{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  cursor:pointer;transition:.15s;
}
.journal-entry:hover{border-color:var(--border2);}
.je-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.je-author{display:flex;align-items:center;gap:8px;}
.je-emoji{font-size:18px;}
.je-name{font-size:13px;font-weight:600;color:var(--accent2);}
.je-date{font-size:10px;color:var(--text3);}
.je-text{font-size:13px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

/* ── SWITCHES LOG ──────────────────────────────── */
#page-switches,#page-logs{padding:16px;display:flex;flex-direction:column;gap:16px;height:100%;overflow-y:auto;}
.switch-new-btn{
  background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:10px 18px;
  font-size:13px;font-weight:700;align-self:flex-start;
}
.switch-log{display:flex;flex-direction:column;gap:0;}
.switch-day-group{margin-bottom:12px;}
.switch-day-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;padding:8px 0 4px;}
.switch-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
  position:relative;
}
.switch-item:last-child{border-bottom:none;}
.switch-line{
  position:absolute;left:16px;top:32px;bottom:-10px;
  width:2px;background:var(--border);
}
.switch-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  margin-top:5px;flex-shrink:0;z-index:1;
}
.switch-time{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px;white-space:nowrap;}
.switch-details{flex:1;}
.switch-alter{font-size:13px;font-weight:600;color:var(--text);}
.switch-intensity{font-size:11px;color:var(--text3);margin-top:2px;}
.switch-context{font-size:11px;color:var(--text2);margin-top:4px;font-style:italic;}
.intensity-douce{color:var(--green);}
.intensity-neutre{color:var(--text3);}
.intensity-difficile{color:var(--red);}

/* ── DISCORD-STYLE LOGS ──────────────────────────── */
.log-entry{
  display:flex;gap:10px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-family:var(--mono);font-size:11px;
}
.log-ts{color:var(--text3);white-space:nowrap;flex-shrink:0;}
.log-type{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;flex-shrink:0;text-transform:uppercase;}
.log-switch{background:rgba(201,168,124,0.2);color:var(--accent);}
.log-mood{background:rgba(122,176,212,0.2);color:var(--blue);}
.log-note{background:rgba(176,158,206,0.2);color:var(--purple);}
.log-msg{color:var(--text2);flex:1;}
.log-msg strong{color:var(--accent2);}

/* ── MÉMO ──────────────────────────────────────── */
#page-memo{display:flex;height:100%;overflow:hidden;}
.memo-sidebar{
  width:180px;min-width:180px;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.memo-sidebar-head{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.memo-new-page{
  width:100%;background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:7px;
  font-size:12px;font-weight:700;
}
.memo-pages{flex:1;overflow-y:auto;padding:8px 0;}
.memo-page-item{
  padding:8px 12px;cursor:pointer;font-size:12px;color:var(--text2);
  transition:.15s;
}
.memo-page-item:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.memo-page-item.active{background:rgba(201,168,124,0.15);color:var(--accent2);}
.memo-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.memo-page-title{
  background:transparent;border:none;border-bottom:1px solid var(--border);
  padding:14px 20px;font-size:18px;font-weight:700;color:var(--accent2);
  width:100%;
}
.memo-page-title::placeholder{color:var(--text3);}
.memo-content{
  flex:1;background:transparent;border:none;
  padding:16px 20px;font-size:14px;color:var(--text);
  resize:none;line-height:1.8;
}
.memo-content::placeholder{color:var(--text3);}
.memo-toolbar{
  border-top:1px solid var(--border);padding:10px 16px;
  display:flex;gap:8px;background:var(--bg2);flex-shrink:0;
}
.memo-tb-btn{
  background:rgba(255,255,255,0.06);color:var(--text2);
  border-radius:6px;padding:5px 10px;font-size:12px;
}

/* ── INNERWORLD (Photos) ──────────────────────────── */
#page-innerworld{padding:16px;height:100%;overflow-y:auto;}
.iw-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.iw-add-btn{
  background:var(--accent);color:var(--bg3);
  border-radius:var(--radius-sm);padding:8px 16px;
  font-size:12px;font-weight:700;
}
.iw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.iw-photo{
  border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border);position:relative;
  aspect-ratio:1;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;
}
.iw-photo:hover{border-color:var(--accent);}
.iw-photo img{width:100%;height:100%;object-fit:cover;}
.iw-photo .iw-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  padding:6px;font-size:11px;color:#fff;
}
.iw-empty{
  grid-column:1/-1;text-align:center;
  padding:40px;color:var(--text3);
}
.iw-empty .iw-empty-icon{font-size:40px;margin-bottom:8px;}
